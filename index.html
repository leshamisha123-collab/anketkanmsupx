<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на консультацию</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #080808;
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
            padding: 40px 20px;
        }
        .container { max-width: 560px; margin: 0 auto; }
        h1 {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }
        h1 span { color: #d4af37; font-style: italic; }
        .subtitle {
            font-size: 16px;
            color: #9a9a9a;
            margin-bottom: 40px;
            line-height: 1.5;
        }
        .field { margin-bottom: 24px; }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }
        label .num { color: #d4af37; margin-right: 6px; font-size: 12px; }
        label .optional { color: #5a5a5a; font-weight: 400; font-size: 12px; }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus { border-color: #d4af37; }
        input::placeholder { color: #5a5a5a; }
        select { cursor: pointer; -webkit-appearance: none; appearance: none; }
        select option { background: #131313; color: #fff; }
        button {
            width: 100%;
            padding: 18px;
            background: #d4af37;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: 8px;
            transition: background 0.2s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background: #e8c65a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .note {
            text-align: center;
            font-size: 13px;
            color: #5a5a5a;
            margin-top: 16px;
        }
        .error-text {
            display: none;
            font-size: 12px;
            color: #ff5555;
            margin-top: 6px;
        }
        .error-text.show { display: block; }
        .success {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }
        .success.show { display: block; }
        .success h2 { font-size: 28px; margin-bottom: 12px; }
        .success p { color: #9a9a9a; }
    </style>
</head>
<body>
    <div class="container">
        <div id="formBlock">
            <h1>Ты теряешь контроль. <span>Давай вернём его.</span></h1>
            <p class="subtitle">Заполни анкету. Я посмотрю твою ситуацию и напишу, чтобы договориться о звонке. Беру не всех.</p>

            <form id="leadForm" action="https://formspree.io/f/mnpjrgyd" method="POST">
                <div class="field">
                    <label><span class="num">01</span>Как тебя зовут?</label>
                    <input type="text" id="name" name="name" placeholder="Имя" required autocomplete="name">
                </div>

                <div class="field">
                    <label><span class="num">02</span>Сколько часов в день ты теряешь в телефоне?</label>
                    <input type="text" id="hours" name="hours" placeholder="Например: 4–5 часов" required>
                </div>

                <div class="field">
                    <label><span class="num">03</span>Что ты откладываешь из-за этого?</label>
                    <input type="text" id="problem" name="problem" placeholder="Учёба, спорт, проект, бизнес..." required>
                </div>

                <div class="field">
                    <label><span class="num">04</span>Куда тебе удобнее получить ответ?</label>
                    <select id="messenger" name="messenger" required>
                        <option value="" disabled selected>Выбери мессенджер</option>
                        <option value="Telegram">Telegram</option>
                        <option value="WhatsApp">WhatsApp</option>
                    </select>
                </div>

                <div class="field">
                    <label><span class="num">05</span>Твой Telegram или телефон для связи</label>
                    <input type="text" id="contact" name="contact" placeholder="@username или +375..." required>
                    <div class="error-text" id="contactError">Напиши, как с тобой связаться</div>
                </div>

                <button type="submit" id="submitBtn">Оставить заявку</button>
                <p class="note">Это не спам. Я напишу лично.</p>
            </form>
        </div>

        <div class="success" id="successBlock">
            <h2>Заявка отправлена</h2>
            <p>Я получил твою анкету. Напишу тебе в ближайшее время, чтобы договориться о звонке.</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('leadForm');
        const submitBtn = document.getElementById('submitBtn');
        const formBlock = document.getElementById('formBlock');
        const successBlock = document.getElementById('successBlock');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Проверка поля связи
            const contact = document.getElementById('contact').value.trim();
            if (contact.length < 3) {
                document.getElementById('contactError').classList.add('show');
                document.getElementById('contact').focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    formBlock.style.display = 'none';
                    successBlock.classList.add('show');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    throw new Error('Ошибка сервера');
                }
            } catch (error) {
                console.error(error);
                alert('Не удалось отправить. Проверь интернет и попробуй ещё раз.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Оставить заявку';
            }
        });
    </script>
</body>
</html>
